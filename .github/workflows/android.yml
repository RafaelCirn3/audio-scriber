name: Android APK (debug)
on:
  push:
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest includes Android commandline tools and SDK.
      # Avoid setup-android action trying to install removed SDK package "tools".
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle verified Portuguese Vosk model into APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Android/app/src/main/assets
          SOURCE="$RUNNER_TEMP/vosk-model-small-pt-0.3-original.zip"
          MODEL="Android/app/src/main/assets/vosk-model-small-pt-0.3.zip"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 300 \
            "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" -o "$SOURCE"
          echo "6e1ce909032e1afa7a88e68a3d628ecafff302bdf195befab308826c395e93b7  $SOURCE" | sha256sum -c -
          unzip -t "$SOURCE" >/dev/null
          python3 Android/scripts/prepare_vosk_model.py "$SOURCE" "$MODEL"
          unzip -t "$MODEL" >/dev/null
      - name: Validate Vosk native model loading and recognition\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 -m pip install --quiet vosk==0.3.45\n          python3 Android/scripts/smoke_test_vosk.py Android/app/src/main/assets/vosk-model-small-pt-0.3.zip\n      - name: Compile APK
        working-directory: Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify generated APK
        run: test -s Android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AudioScriber-Android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Prepare downloadable APK
        run: |
          cp Android/app/build/outputs/apk/debug/app-debug.apk AudioScriber-Android-beta.apk
          sha256sum AudioScriber-Android-beta.apk > AudioScriber-Android-beta.apk.sha256
      - name: Publish standalone APK via GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v0.1.4-beta"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AudioScriber-Android-beta.apk AudioScriber-Android-beta.apk.sha256 --clobber
          else
            gh release create "$TAG" AudioScriber-Android-beta.apk AudioScriber-Android-beta.apk.sha256 \
              --title "Audio Scriber Android v0.1.4-beta" \
              --notes "APK Android instalável diretamente no tablet. Versão de testes assinada com chave de depuração do GitHub Actions. O modelo português está incorporado ao APK e a primeira execução apenas o prepara localmente. Ainda não validada em tablet físico." \
              --prerelease --target "$GITHUB_SHA"
          fi
